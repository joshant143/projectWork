<div [formGroup]="group">
  <mat-card class="claim-form-card">
    <div class="app-form-card">
      <div class="app-form-header">
        <span class="app-form-title">Contact Information</span>
        <span class="app-form-required">* Required Field</span>
      </div>

      <div class="app-form-content">
        <div class="app-form-grid">
          <!-- Are you the Claimant -->
          <div class="app-form-group">
            <label>Are you the Claimant?</label>

            <mat-form-field appearance="outline" class="compact-field">
              <mat-select formControlName="isClaimant">
                <mat-option [value]="true">Yes</mat-option>
                <mat-option [value]="false">No</mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <!-- Contact Name -->
          <div class="app-form-group">
            <label>Contact Name</label>

            <mat-form-field appearance="outline" class="compact-field">
              <input matInput formControlName="contactName" placeholder="Enter Contact Name" />
            </mat-form-field>
          </div>

          <!-- Contact Phone -->
          <div class="app-form-group">
            <label>Contact Phone</label>

            <mat-form-field appearance="outline" class="compact-field">
              <input matInput formControlName="contactPhone" placeholder="Enter Contact Phone" />
            </mat-form-field>
          </div>

          <!-- Contact Email -->
          <div class="app-form-group">
            <label>Contact Email</label>

            <mat-form-field appearance="outline" class="compact-field">
              <input matInput formControlName="contactEmail" placeholder="Enter Contact Email" />
            </mat-form-field>
          </div>
        </div>
      </div>
    </div>
  </mat-card>
</div>
