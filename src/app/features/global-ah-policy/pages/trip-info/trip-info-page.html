<mat-card class="sub-card" [formGroup]="group">
  <div class="sub-card-header">Trip Information</div>

  <div class="sub-card-body">
    <div class="form-row">
      <label>Date of Departure</label>

      <mat-form-field appearance="outline">
        <input matInput [matDatepicker]="dep" formControlName="departureDate" />
        <mat-datepicker-toggle matSuffix [for]="dep"></mat-datepicker-toggle>
        <mat-datepicker #dep></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="form-row">
      <label>Date of Return/Expected Return</label>

      <mat-form-field appearance="outline">
        <input matInput [matDatepicker]="ret" formControlName="returnDate" />
        <mat-datepicker-toggle matSuffix [for]="ret"></mat-datepicker-toggle>
        <mat-datepicker #ret></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="form-row">
      <label>Reason for Travel</label>

      <mat-form-field appearance="outline">
        <input matInput formControlName="reason" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <label>Departure City</label>

      <mat-form-field appearance="outline">
        <input matInput formControlName="departureCity" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <label>Destination City</label>

      <mat-form-field appearance="outline">
        <input matInput formControlName="destinationCity" />
      </mat-form-field>
    </div>
  </div>
</mat-card>
